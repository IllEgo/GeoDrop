<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b5d5d">
  <title>Open a Kithe Experience</title>
  <style>
    :root{color-scheme:light;--teal:#0b5d5d;--cream:#fff8ec;--ink:#132322;--muted:#526563;--amber:#e07b24}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#dff1ee,var(--cream));color:var(--ink);font:17px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100% - 2rem,38rem);padding:2rem;background:rgba(255,255,255,.94);border:1px solid rgba(11,93,93,.18);border-radius:1.5rem;box-shadow:0 1.25rem 3rem rgba(11,70,70,.12)}
    .brand{display:flex;align-items:center;gap:.65rem;color:var(--teal);font-weight:850;letter-spacing:.15em}.mark{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:.8rem;background:var(--teal);color:#fff;font-size:1.35rem;letter-spacing:0}.dot{width:.45rem;height:.45rem;border-radius:50%;background:var(--amber)}
    h1{font-size:clamp(2rem,8vw,3rem);line-height:1.08;letter-spacing:-.035em;margin:2rem 0 1rem}p{margin:0;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <header class="brand" aria-label="Kithe"><span class="mark" aria-hidden="true">K</span><span>KITHE</span><span class="dot" aria-hidden="true"></span></header>
    <h1>Open your Experience link</h1>
    <p>Use the QR code or link your host shared. If you only have an Experience code, enter it in the Kithe app.</p>
  </main>
</body>
</html>
