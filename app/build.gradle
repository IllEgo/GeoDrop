plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def booleanBuildFlag = { List<String> propertyNames, boolean defaultValue ->
    def configuredValue = null
    for (String propertyName : propertyNames) {
        configuredValue = project.findProperty(propertyName) ?: System.getenv(propertyName)
        if (configuredValue != null) {
            break
        }
    }
    if (configuredValue == null) {
        return defaultValue.toString()
    }

    def normalizedValue = configuredValue.toString().trim().toLowerCase()
    if (!(normalizedValue in ['true', 'false'])) {
        throw new GradleException("${propertyNames[0]} must be either true or false")
    }
    return normalizedValue
}

def appLinkHost = (
        project.findProperty('KITHE_APP_LINK_HOST')
                ?: System.getenv('KITHE_APP_LINK_HOST')
                // Temporary compatibility aliases for existing local/CI setup.
                ?: project.findProperty('GEODROP_APP_LINK_HOST')
                ?: System.getenv('GEODROP_APP_LINK_HOST')
                ?: 'r5-unconfigured.invalid'
).toString().trim().toLowerCase()
if (!(appLinkHost ==~ /[a-z0-9.-]+/) || appLinkHost.contains('..')) {
    throw new GradleException('KITHE_APP_LINK_HOST must be a bare HTTPS host name')
}
if (appLinkHost == 'geodrop.app') {
    throw new GradleException('geodrop.app is documented as unowned and cannot be claimed by Kithe')
}

android {
    namespace 'com.kitheapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kitheapp'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [kitheAppLinkHost: appLinkHost]
        buildConfigField 'String', 'APP_LINK_HOST', '"' + appLinkHost.replace('"', '\\"') + '"'
        buildConfigField 'boolean', 'APP_LINK_CONFIGURED', (appLinkHost != 'r5-unconfigured.invalid').toString()

        def functionsRegion = (
                project.findProperty('FIREBASE_FUNCTIONS_REGION')
        ) ?: System.getenv('FIREBASE_FUNCTIONS_REGION') ?: 'us-central1'
        def escapedFunctionsRegion = functionsRegion.toString().replace('"', '\\"')
        buildConfigField(
                'String',
                'FIREBASE_FUNCTIONS_REGION',
                '"' + escapedFunctionsRegion + '"'
        )

        def googleWebClientId = (
                project.findProperty('GOOGLE_WEB_CLIENT_ID')
                        ?: System.getenv('GOOGLE_WEB_CLIENT_ID')
        ) ?: ""
        def escapedGoogleWebClientId = googleWebClientId.toString().replace('"', '\\"')
        buildConfigField(
                'String',
                'GOOGLE_WEB_CLIENT_ID',
                '"' + escapedGoogleWebClientId + '"'
        )

        def googleMapsApiKey = (
                project.findProperty('GOOGLE_MAPS_API_KEY')
                        ?: System.getenv('GOOGLE_MAPS_API_KEY')
        )?.toString()?.trim()
        def mapsConfigured = googleMapsApiKey != null && !googleMapsApiKey.isEmpty()
        // Do not reuse Firebase's general API key for Maps. Kithe needs a dedicated,
        // package/SHA-restricted Maps key after the Maps terms and billing gate.
        resValue 'string', 'google_maps_key', mapsConfigured
                ? googleMapsApiKey
                : 'KITHE_MAPS_API_KEY_NOT_CONFIGURED'
        buildConfigField 'boolean', 'MAPS_CONFIGURED', mapsConfigured.toString()

        // Build-time upper bounds for the Remote Config controls. A feature is
        // enabled only when this value and its pilot_* Remote Config value are true.
        buildConfigField 'boolean', 'FEATURE_CREATION_ENABLED', booleanBuildFlag(['KITHE_FEATURE_CREATION_ENABLED', 'GEODROP_FEATURE_CREATION_ENABLED'], false)
        buildConfigField 'boolean', 'FEATURE_NOTIFICATIONS_ENABLED', booleanBuildFlag(['KITHE_FEATURE_NOTIFICATIONS_ENABLED', 'GEODROP_FEATURE_NOTIFICATIONS_ENABLED'], false)
        buildConfigField 'boolean', 'FEATURE_COUPONS_ENABLED', booleanBuildFlag(['KITHE_FEATURE_COUPONS_ENABLED', 'GEODROP_FEATURE_COUPONS_ENABLED'], false)
        buildConfigField 'boolean', 'FEATURE_MEDIA_ENABLED', booleanBuildFlag(['KITHE_FEATURE_MEDIA_ENABLED', 'GEODROP_FEATURE_MEDIA_ENABLED'], false)
        buildConfigField 'boolean', 'FEATURE_HUNTS_ENABLED', booleanBuildFlag(['KITHE_FEATURE_HUNTS_ENABLED', 'GEODROP_FEATURE_HUNTS_ENABLED'], false)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        release {
            buildConfigField 'boolean', 'USE_PLAY_INTEGRITY_APPCHECK', 'true'
        }
        internal {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'USE_PLAY_INTEGRITY_APPCHECK', 'false'
            // This variant exists to be sideloaded for on-device testing, so it has
            // to be installable. It inherits from release, which is unsigned, and an
            // unsigned APK cannot be installed at all. The debug keystore is the
            // right key here: internal builds are never distributed.
            signingConfig signingConfigs.debug
        }
        debug {
            buildConfigField 'boolean', 'USE_PLAY_INTEGRITY_APPCHECK', 'false'
        }
    }
}

dependencies {
    def compose_version = '1.6.8'

    implementation "androidx.compose.material:material-icons-extended:${compose_version}"
	
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // Firebase BOM first (no versions on individual Firebase libs)
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.firebase:firebase-functions-ktx'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    internalImplementation 'com.google.firebase:firebase-appcheck-debug'

    // Firebase Auth (PLAIN, not -ktx)
    implementation 'com.google.firebase:firebase-auth'

    // Firestore & Messaging (ktx is fine)
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // Crash reporting. Product analytics uses the privacy-minimal server ledger.
    implementation 'com.google.firebase:firebase-crashlytics-ktx'

    // Play Services Location (fused + geofencing)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Compose + Material3 + Foundation
    implementation "androidx.compose.ui:ui-text-google-fonts:${compose_version}"
    implementation "androidx.compose.ui:ui:${compose_version}"
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.compose.foundation:foundation:${compose_version}"
    implementation "androidx.compose.foundation:foundation-layout:${compose_version}"
    implementation "androidx.compose.ui:ui-tooling-preview:${compose_version}"
    debugImplementation "androidx.compose.ui:ui-tooling:${compose_version}"

    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    // Supplies the Theme.Material3.* parent that res/values/themes.xml extends.
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.1'
    testImplementation "androidx.compose.ui:ui-test-junit4:${compose_version}"
    testImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:${compose_version}"
    debugImplementation "androidx.compose.ui:ui-test-manifest:${compose_version}"

    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // Core-only QR encoding for the organizer's locally generated join artifact.
    // No scanner activity, tracking SDK, or vendor-hosted link service is included.
    implementation 'com.google.zxing:core:3.5.4'

    // Maps: the core library (CameraUpdateFactory, BitmapDescriptorFactory) plus
    // the Compose wrapper.
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation "com.google.maps.android:maps-compose:2.11.4"

    // Jetpack Compose image loading with Coil
    implementation "io.coil-kt:coil-compose:2.7.0"

    // AndroidX Media3 — ExoPlayer + PlayerControlView back DropAudioPlayer.
    // Video playback was removed at task 2.3; audio drops are launch scope.
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
