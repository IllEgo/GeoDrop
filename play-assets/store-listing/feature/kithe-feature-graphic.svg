<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title description">
  <title id="title">Kithe feature graphic</title>
  <desc id="description">Kithe wordmark and the message Find what a place is holding beside a three-stop trail.</desc>
  <rect width="1024" height="500" fill="#FDFCFA"/>
  <rect x="0" y="0" width="26" height="500" fill="#0B5D5D"/>

  <g transform="translate(76 76)">
    <rect width="88" height="88" rx="22" fill="#0B5D5D"/>
    <path d="M30 21V68M34 44L60 23M34 44L61 68" fill="none" stroke="#FDFCFA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="62" cy="21" r="8" fill="#FDFCFA"/>
    <circle cx="62" cy="21" r="5" fill="#E07B24"/>
  </g>

  <text x="184" y="142" fill="#0B5D5D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Kithe</text>
  <text x="76" y="244" fill="#14171A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5">Find what a place</text>
  <text x="76" y="307" fill="#14171A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5">is holding.</text>
  <text x="78" y="365" fill="#4A525C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Follow an invitation.</text>
  <text x="78" y="398" fill="#4A525C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Walk to the spot. Unlock the drop.</text>

  <g transform="translate(700 58)">
    <rect width="266" height="384" rx="34" fill="#FFFFFF" stroke="#CDD8D4" stroke-width="2"/>
    <text x="34" y="49" fill="#0B5D5D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.8">A NEARBY TRAIL</text>
    <text x="34" y="78" fill="#4A525C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">3 drops</text>
    <line x1="61" y1="133" x2="61" y2="307" stroke="#CDD8D4" stroke-width="4"/>

    <circle cx="61" cy="133" r="23" fill="#0B5D5D"/>
    <path d="M50 133L58 141L73 124" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="99" y="128" fill="#14171A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">Gathering place</text>
    <text x="99" y="151" fill="#4A525C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">Found</text>

    <circle cx="61" cy="220" r="23" fill="#FFFFFF" stroke="#E07B24" stroke-width="4"/>
    <circle cx="61" cy="220" r="7" fill="#E07B24"/>
    <text x="99" y="215" fill="#14171A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">Shoreline path</text>
    <text x="99" y="238" fill="#8A4208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Nearby</text>

    <circle cx="61" cy="307" r="23" fill="#FFFFFF" stroke="#5B6470" stroke-width="4"/>
    <text x="61" y="313" text-anchor="middle" fill="#5B6470" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">3</text>
    <text x="99" y="302" fill="#14171A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">Final viewpoint</text>
    <text x="99" y="325" fill="#4A525C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">Keep walking</text>
  </g>
</svg>
